[package]
name = "jwt-debugger"
version = "0.1.0"
edition = "2024"
authors = ["Hai Pham Ngoc <haiphamngoc.tech@gmail.com>"]
description = "A comprehensive CLI tool to inspect, decode, verify, and debug JSON Web Tokens (JWT/JWS/JWK/JWKS)"
license = "MIT"
readme = "README.md"
keywords = ["jwt", "jws", "jwk", "jwks", "crypto", "cli", "security"]
categories = ["command-line-utilities", "cryptography", "development-tools"]
repository = "https://github.com/haiphamngoc-dev/jwt-debugger"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
colored = "3.1.1"
ed25519-dalek = { version = "2.1.1", features = ["pkcs8", "pem"] }
hex = "0.4.3"
hmac = "0.12.1"
humantime = "2.4.0"
p256 = { version = "0.13.2", features = ["ecdsa", "pem", "pkcs8"] }
p384 = { version = "0.13.1", features = ["ecdsa", "pem", "pkcs8"] }
pkcs8 = { version = "0.10.2", features = ["pem"] }
reqwest = { version = "0.13.5", features = ["blocking"] }
rsa = { version = "0.9.10", features = ["pem"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.10.9", features = ["oid"] }
thiserror = "2.0.20"
url = "2.5.8"
zeroize = "1.8.1"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true


