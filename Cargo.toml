[package]
name = "jwt-debugger"
version = "0.1.0"
edition = "2024"
authors = ["Hai Pham Ngoc <haiphamngoc.tech@gmail.com>"]
description = "A comprehensive CLI tool to inspect, decode, verify, and debug JSON Web Tokens (JWT/JWS/JWK/JWKS)"
license = "MIT"
readme = "README.md"
keywords = ["jwt", "jws", "jwk", "jwks", "crypto", "cli", "security"]
categories = ["command-line-utilities", "cryptography", "development-tools"]
repository = "https://github.com/haiphamngoc-dev/jwt-debugger"

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
chrono-tz = "0.10.4"
humantime = "2.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
